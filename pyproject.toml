[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-tio"
version = "3.0.0"
description = "Markdown Second Brain with one modular Telegram runner and two-agent planning"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
second-brain = "second_brain.cli:main"

[tool.setuptools.packages.find]
include = ["second_brain*"]

[tool.setuptools.package-data]
second_brain = ["web/*"]

name: Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m compileall -q second_brain services tools scripts _tools
      - run: python -m second_brain --version
